production:
  categorize_products:
    class: CategorizeProductsJob
    schedule: every day at midnight
  train_category_model:
    class: TrainCategoryModelJob
    schedule: every day at 1am
  # Deploy only once server backups are on — the first run deletes historical orphaned PDFs for good.
  data_retention:
    class: DataRetentionJob
    schedule: every day at 2am
